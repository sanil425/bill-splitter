<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SplitIt Share page</title>

<x-dc>

body{margin:0}
*{box-sizing:border-box}
a{color:#047857}a:hover{color:#065F46}

<div class="h" style="font-size: 18px; font-weight: 700; color: {{accent}}">SplitIt</div>
<div>
<div class="h" style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Osushi Ardmore</div>
<div class="muted" style="font-size: 15px; margin-top: 4px">Sep 25, 2026 · split by Sanil · $187.36</div>
</div>
<div style="background: #fff; border: 1px solid #E7E5E4; border-radius: 16px; overflow: hidden">
<div class="row" style="border-top: 0"><span style="font-weight: 600">Sanil</span><span style="font-weight: 600">$58.40</span></div>
<div class="row"><span style="font-weight: 600">Ali</span><span style="font-weight: 600">$49.33</span></div>
<div class="row" style="flex-direction: column; align-items: stretch; gap: 8px; background: #F7FDFA">

<div class="li"><span>Coke (1 of 2)</span><span>$2.95</span></div>
<div class="li muted"><span>Tax</span><span>$1.26</span></div>
</div>
</div>
<div class="row"><span style="font-weight: 600">Maya</span><span style="font-weight: 600">$57.42</span></div>
</div>

<div style="flex: 1"></div>
<div class="muted" style="font-size: 13px; text-align: center">This link expires on Oct 25. <a href="#">Make your own split</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#047857"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#047857' };
}
}
</script>

</html>
