<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SplitIt Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#047857}a:hover{color:#065F46}
.h{font-family:'Space Grotesk',Inter,sans-serif}
.card{background:#fff;border:1px solid #E7E5E4;border-radius:16px;padding:16px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#57534E}
.muted{color:#57534E}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAFAF9; font-family: Inter, sans-serif; color: #1C1917; display: flex; flex-direction: column; padding: 24px 20px; gap: 28px">
<div class="row" style="padding-top: 24px">
<div>
<div class="h" style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em">SplitIt</div>
<div class="muted" style="font-size: 15px; margin-top: 4px">Hi Sanil</div>
</div>
</div>
<button style="border: 0; border-radius: 20px; background: {{accent}}; color: #fff; padding: 24px 20px; text-align: left; display: flex; flex-direction: column; gap: 14px; font-family: Inter, sans-serif">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<span class="h" style="font-size: 24px; font-weight: 700">New split</span>
<span style="font-size: 15px; opacity: 0.92">Snap the receipt, then say or type who had what.</span>
</button>
<div style="display: flex; flex-direction: column; gap: 12px">
<div class="lbl">Recent</div>
<a href="#" class="card" style="text-decoration: none; color: #1C1917; display: flex; flex-direction: column; gap: 6px">
<div class="row"><span style="font-weight: 600; font-size: 16px">Osushi Ardmore</span><span style="font-weight: 600; font-size: 16px">$187.36</span></div>
<div class="row"><span class="muted" style="font-size: 14px">Sep 25 · 4 people</span><span style="font-size: 13px; font-weight: 600; color: #065F46; background: #ECFDF5; padding: 3px 10px; border-radius: 999px">Sent</span></div>
</a>
<div class="muted" style="font-size: 13px; text-align: center; padding-top: 8px">Splits are saved on this phone only.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#047857"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#047857' };
}
}
</script>
</body>
</html>
